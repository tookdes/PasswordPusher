name: Build Linux x64 portable bundle

on:
  push:
    branches:
      - master
      - fix-linux-portable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_SERVE_STATIC_FILES: "1"
      RAILS_LOG_TO_STDOUT: "1"
      DISABLE_BOOTSNAP: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libpq-dev default-libmysqlclient-dev libsqlite3-dev \
            libyaml-dev libssl-dev zlib1g-dev curl

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: false

      - name: Install gems and refresh portable lockfile
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local frozen false
          bundle install --jobs 4

      - name: Configure ephemeral CI encryption keys
        run: |
          echo "SECRET_KEY_BASE=$(ruby -rsecurerandom -e 'print SecureRandom.hex(64)')" >> "$GITHUB_ENV"
          echo "PWPUSH_MASTER_KEY=$(ruby -rsecurerandom -e 'print SecureRandom.hex(32)')" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install Yarn dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Build CSS
        run: yarn build:css:single

      - name: Prepare test database
        env:
          RAILS_ENV: test
          RACK_ENV: test
          CI: ""
        run: |
          mkdir -p storage/db
          bundle exec rails db:schema:load

      - name: Run quick-share tests
        env:
          RAILS_ENV: test
          RACK_ENV: test
        run: bundle exec rails test test/controllers/quick_pushes_controller_test.rb

      - name: Precompile assets
        env:
          RAILS_ENV: test
          RACK_ENV: test
          CI: ""
        run: bundle exec rails assets:precompile

      - name: Install OCRAN
        run: gem install ocran --no-document

      - name: Prepare dependency-scan database
        run: cp storage/db/test.sqlite3 /tmp/password-pusher-ocran.sqlite3

      - name: Build portable Linux x64 directory
        env:
          PWP_OCRAN_SCAN: "1"
          DATABASE_URL: sqlite3:/tmp/password-pusher-ocran.sqlite3
        run: |
          rm -rf dist
          mkdir -p dist

          ocran \
            --output-dir dist/password-pusher-linux-x64 \
            --gemfile Gemfile --no-autoload --gem-all --gem-full=bundler \
            bin/pwp-standalone \
            app config db public lib Gemfile Gemfile.lock VERSION config.ru

          cat > dist/password-pusher-linux-x64/password-pusher <<'SH'
          #!/bin/sh
          set -eu
          SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          cd "$SCRIPT_DIR"
          exec "$SCRIPT_DIR/pwp-standalone.sh" "$@"
          SH
          chmod +x dist/password-pusher-linux-x64/password-pusher
          chmod +x dist/password-pusher-linux-x64/pwp-standalone.sh

          # Rails' server command insists these Rails.root/tmp subdirectories
          # exist. Pre-create them so the application bundle itself may be
          # mounted read-only; actual cache/PID/temp writes are redirected to
          # PWP_DATA_DIR by bin/pwp-standalone.
          mkdir -p \
            dist/password-pusher-linux-x64/src/tmp/cache \
            dist/password-pusher-linux-x64/src/tmp/pids \
            dist/password-pusher-linux-x64/src/tmp/sockets

          du -sh dist/password-pusher-linux-x64
          find dist/password-pusher-linux-x64 -maxdepth 2 -type f | sort | head -50

      - name: Smoke test in clean Ubuntu with tiny tmpfs
        run: |
          set -e
          rm -rf .ci-data
          mkdir -p .ci-data

          docker run --rm \
            --tmpfs /tmp:rw,size=64m,mode=1777 \
            -v "$PWD/dist/password-pusher-linux-x64:/opt/password-pusher:ro" \
            -v "$PWD/.ci-data:/data" \
            -e PWP_DATA_DIR=/data \
            -e PORT=5510 \
            ubuntu:22.04 \
            bash -lc '
              set -e
              /opt/password-pusher/password-pusher --init-user test@example.com ci-test-password-12345
              test -s /data/secret_key_base
              test -s /data/lockbox_master_key
              test -s /data/production.sqlite3

              /opt/password-pusher/password-pusher >/data/server.log 2>&1 &
              pid=$!
              trap "kill $pid 2>/dev/null || true" EXIT

              for i in $(seq 1 90); do
                if (exec 3<>/dev/tcp/127.0.0.1/5510) 2>/dev/null; then
                  kill "$pid" 2>/dev/null || true
                  wait "$pid" 2>/dev/null || true
                  exit 0
                fi
                if ! kill -0 "$pid" 2>/dev/null; then
                  cat /data/server.log
                  exit 1
                fi
                sleep 1
              done

              echo "Timed out waiting for packaged server"
              cat /data/server.log
              exit 1
            '

      - name: Pack portable bundle
        run: |
          tar -C dist -czf password-pusher-linux-x64-portable.tar.gz password-pusher-linux-x64
          sha256sum password-pusher-linux-x64-portable.tar.gz > password-pusher-linux-x64-portable.tar.gz.sha256
          cp Gemfile.lock Gemfile.lock.generated
          ls -lh password-pusher-linux-x64-portable.tar.gz password-pusher-linux-x64-portable.tar.gz.sha256
          cat password-pusher-linux-x64-portable.tar.gz.sha256

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: password-pusher-linux-x64-portable
          path: |
            password-pusher-linux-x64-portable.tar.gz
            password-pusher-linux-x64-portable.tar.gz.sha256
            Gemfile.lock.generated
          if-no-files-found: error
          retention-days: 30
